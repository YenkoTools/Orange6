name: Build, Test & Deploy

# On-demand only.  Run from the Actions tab → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  id-token: write   # needed if you switch to OIDC auth later
  contents: read

jobs:
  # ── 1. Build & test the .NET 8 isolated Functions API ──────────────
  build-api:
    name: Build & Test Api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Api/Api.csproj

      - name: Build (Release)
        run: |
          dotnet build Api/Api.csproj \
            --no-restore \
            --configuration Release

      - name: Test
        # If you add an xUnit / NUnit test project later, it will be picked up
        # automatically by the wildcard pattern below.
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            || echo "No test projects found – skipping."

      - name: Publish (self-contained output for SWA)
        run: |
          dotnet publish Api/Api.csproj \
            --no-build \
            --configuration Release \
            --output "${{ github.workspace }}/publish/api"

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-publish
          path: publish/api
          retention-days: 1

  # ── 2. Build the Astro/React/Tailwind client ────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Client

      # Type-check via astro check (catches Astro + TypeScript errors)
      - name: Type check
        run: npx astro check
        working-directory: Client

      - name: Build
        run: npm run build
        working-directory: Client

      - name: Upload Client artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: Client/dist
          retention-days: 1

  # ── 3. Deploy to Azure Static Web Apps ──────────────────────────────
  deploy:
    name: Deploy to Azure SWA
    runs-on: ubuntu-latest
    needs: [build-api, build-client]   # both builds must succeed first
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Download Client artifact
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: deploy/app

      - name: Download API artifact
        uses: actions/download-artifact@v8
        with:
          name: api-publish
          path: deploy/api

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          # Store the SWA deployment token as a repository secret:
          #   Settings → Secrets → Actions → New secret
          #   Name: AZURE_STATIC_WEB_APPS_API_TOKEN
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          # Point at the pre-built artifacts produced by previous jobs.
          app_location: deploy/app     # pre-built Astro dist
          api_location: deploy/api     # dotnet publish output
          output_location: ""          # already built; nothing to copy

          skip_app_build: true         # skip Oryx client build (we did it above)
          skip_api_build: true         # skip Oryx API build  (we did it above)
