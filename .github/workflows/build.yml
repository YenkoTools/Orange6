name: Build Orange6

# On-demand only.  Run from the Actions tab → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: production
        type: choice
        options:
          - production
          - staging
          - testing

permissions:
  id-token: write   # needed if you switch to OIDC auth later
  contents: read

jobs:
  # ── 1. Build & test the .NET 10 isolated Functions API ─────────────
  build-api:
    name: Build & Test Api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Service/Service.slnx

      - name: Build (Release)
        run: |
          dotnet build Service/Service.slnx \
            --no-restore \
            --configuration Release

      - name: Test
        run: |
          dotnet test Service/Service.slnx \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx"

      - name: Publish (self-contained output for SWA)
        run: |
          dotnet publish Service/src/Api/Api.csproj \
            --no-build \
            --configuration Release \
            --output "${{ github.workspace }}/publish/api"

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-publish
          path: publish/api
          retention-days: 1

  # ── 2. Build the Astro/React/Tailwind client ────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Client

      - name: Lint
        run: npm run lint
        working-directory: Client

      # Type-check via astro check (catches Astro + TypeScript errors)
      - name: Type check
        run: node_modules/.bin/astro check
        working-directory: Client

      - name: Build
        run: npm run build
        working-directory: Client

      - name: Upload Client artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: Client/dist
          retention-days: 1

